{% extends 'base.html' %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2><i class="bi bi-list-task"></i> Minhas Tarefas</h2>
    <a href="{{ url_for('nova_tarefa') }}" class="btn btn-success">
        <i class="bi bi-plus-lg"></i> Nova Tarefa
    </a>
</div>

<div class="alert alert-info">
    <i class="bi bi-lightbulb"></i> <strong>Conselho do dia:</strong> {{ conselho }}
</div>

<div class="row mb-3">
    <div class="col-md-4">
        <label class="form-label">Filtrar por status:</label>
        <select id="filtro-status" class="form-select">
            <option value="todas">Todas</option>
            <option value="pendente">Pendentes</option>
            <option value="em andamento">Em andamento</option>
            <option value="concluida">Concluídas</option>
        </select>
    </div>
</div>

<div id="lista-tarefas" class="row">
    <!-- tarefas carregadas via JavaScript -->
</div>
{% endblock %}

{% block scripts %}
<script>
    // carrega as tarefas quando a pagina abre
    document.addEventListener('DOMContentLoaded', function() {
        carregarTarefas('todas');

        document.getElementById('filtro-status').addEventListener('change', function() {
            carregarTarefas(this.value);
        });
    });

    function carregarTarefas(status) {
        fetch('/api/tarefas?status=' + status)
            .then(resposta => resposta.json())
            .then(tarefas => {
                var container = document.getElementById('lista-tarefas');
                container.innerHTML = '';

                if (tarefas.length === 0) {
                    container.innerHTML = '<div class="col-12"><p class="text-muted">Nenhuma tarefa encontrada.</p></div>';
                    return;
                }

                tarefas.forEach(function(tarefa) {
                    var cor = 'card-pendente';
                    if (tarefa.status === 'em andamento') cor = 'card-andamento';
                    if (tarefa.status === 'concluida') cor = 'card-concluida';

                    var statusTexto = tarefa.status;
                    if (tarefa.status === 'concluida') statusTexto = 'Concluída';

                    var html = `
                        <div class="col-md-4 mb-3">
                            <div class="card ${cor} h-100">
                                <div class="card-body">
                                    <h5 class="card-title">${tarefa.titulo}</h5>
                                    <p class="card-text">${tarefa.descricao || 'Sem descrição'}</p>
                                    <span class="badge bg-secondary">${statusTexto}</span>
                                    <div class="mt-3">
                                        <a href="/editar/${tarefa.id}" class="btn btn-sm btn-primary">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <a href="/excluir/${tarefa.id}" class="btn btn-sm btn-danger"
                                           onclick="return confirm('Excluir esta tarefa?')">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += html;
                });
            });
    }
</script>
{% endblock %}
